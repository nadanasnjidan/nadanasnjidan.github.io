<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="masthead">
    <a href="{{ '/' | relative_url }}" class="masthead__title">
      <span class="masthead__name">Na današnji dan</span>
    </a>
    <p class="masthead__tagline">{{ site.tagline }}</p>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="footer">
    <p class="footer__attribution">
      Zgodovinski članki iz korpusa

      (Dobranić, Evkoski, Ljubešić, INZ 2024).
      Licenca: CC&nbsp;BY-SA&nbsp;4.0.
    </p>
    <p class="footer__nav">
      <a href="{{ '/about/' | relative_url }}">O projektu</a>
      &nbsp;·&nbsp;
      <a href="{{ '/archive/' | relative_url }}">Arhiv</a>
      &nbsp;·&nbsp;
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </footer>
</body>
</html>
