title: "Na današnji dan"
tagline: "Ne beri trenutnih novic — vse se je že zgodilo."
theme: null  # disable minima default theme — we have our own layouts/CSS
description: >-
  Vsak dan en zgodovinski članek iz slovenskih časopisov 1771–1914,
  ki rezonira s sodobno novico.
url: "https://nadanasnjidan.github.io"
baseurl: ""

author:
  name: "Davorin Pavlica"
  email: "nadanasnjidan@zvpl.com"

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:slug/
future: false  # ne pokaži postov z datumom v prihodnost

# Collections
collections:
  articles:
    output: true
    permalink: /articles/:path/

# Plugins (whitelist na GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "daily"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE.md
  - .gitignore
