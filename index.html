<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <title>Na današnji dan</title>
  <script>
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    window.location.replace('./' + mm + '-' + dd + '/');
  </script>
</head>
<body><p>Preusmeritev&hellip;</p></body>
</html>
